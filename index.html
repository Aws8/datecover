<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>DateCover</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DateCover">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  :root{
    --bg:#08090c; --panel:#101318; --panel2:#181c23; --panel3:#1f242e;
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.14);
    --txt:#f2f5f9; --mut:#8e99a8; --mut2:#6b7684;
    --acc:#3d7bff; --acc-hi:#5c91ff; --acc2:#2f62d8; --danger:#ff5d5d;
    --r-lg:14px; --r-md:11px; --r-sm:8px;
    --shadow:0 8px 24px rgba(0,0,0,.45);
    --ease:cubic-bezier(.22,1,.36,1);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;}
  body{display:flex;flex-direction:column;overscroll-behavior:none;height:100dvh;touch-action:manipulation;overflow-x:hidden;width:100%}
  ::selection{background:rgba(61,123,255,.35)}
  ::-webkit-scrollbar{width:0;height:0}
  button{-webkit-appearance:none;appearance:none;border-radius:var(--r-md);cursor:pointer;
    transition:transform .12s var(--ease), background .18s var(--ease), opacity .18s var(--ease)}
  button:active{transform:scale(.96)}
  button:focus-visible{outline:2px solid var(--acc-hi);outline-offset:2px}

  /* sliders — iOS-style thin track, floating thumb */
  input[type=range]{-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.13);border-radius:99px;height:5px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;
    background:#fff;border:none;box-shadow:0 2px 8px rgba(0,0,0,.5), 0 0 0 .5px rgba(0,0,0,.2)}
  input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:none;box-shadow:0 2px 8px rgba(0,0,0,.5)}

  header{display:flex;align-items:center;
    padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px;border-bottom:1px solid var(--line);
    background:rgba(16,19,24,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
  header .count{font-size:13px;color:var(--mut)}
  header .ver{font-size:11px;color:var(--mut2);margin-left:auto;margin-right:10px;font-weight:600;
    background:var(--panel2);padding:3px 8px;border-radius:99px;letter-spacing:.3px}
  header .count{margin-left:0}

  main{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
  .drop{border:1.5px dashed var(--line2);border-radius:var(--r-lg);padding:42px 20px;text-align:center;color:var(--mut);
    background:var(--panel);font-size:14.5px;line-height:1.65}
  .drop b{color:var(--txt);font-size:16px;display:block;margin:10px 0 2px}
  .drop svg{display:block;margin:0 auto;opacity:.85}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .cell{position:relative;aspect-ratio:1/1;border-radius:var(--r-md);overflow:hidden;background:var(--panel2);
    border:1px solid var(--line);animation:pop .3s var(--ease) backwards}
  @keyframes pop{from{opacity:0;transform:scale(.92)}}
  .cell canvas{width:100%;height:100%;object-fit:cover;display:block}
  .cell .rm{position:absolute;top:6px;right:6px;width:25px;height:25px;border-radius:50%;
    background:rgba(10,10,14,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    color:#fff;border:none;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}

  /* bottom toolbar */
  .toolbar{display:flex;gap:9px;padding:12px 14px calc(12px + var(--safe-b));border-top:1px solid var(--line);
    background:rgba(16,19,24,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);align-items:center;flex-wrap:wrap}
  .seg{display:flex;background:var(--panel2);border-radius:var(--r-md);padding:2.5px;gap:2px}
  .seg button{background:transparent;border:none;color:var(--mut);padding:8px 14px;font-size:13.5px;font-weight:600;border-radius:var(--r-sm)}
  .seg button.on{background:var(--acc);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .btn{background:var(--acc);border:none;color:#fff;padding:11px 16px;font-size:15px;font-weight:650;
    box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .btn:active{background:var(--acc2)}
  .btn.ghost{background:var(--panel2);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
  .btn.grow{flex:1}
  .btn:disabled{opacity:.4;box-shadow:none}
  .row{display:flex;align-items:center;gap:10px;width:100%;flex-wrap:wrap;row-gap:8px}
  .row label{font-size:12px;color:var(--mut);white-space:nowrap;font-weight:500}
  input[type=range]{flex:1 1 60px;min-width:50px;max-width:130px;accent-color:var(--acc)}

  /* iOS-style switch */
  .sw{-webkit-appearance:none;appearance:none;width:44px;height:26px;border-radius:99px;background:rgba(255,255,255,.16);
    position:relative;transition:background .2s var(--ease);flex:0 0 auto;outline:none;border:none;margin:0}
  .sw:checked{background:var(--acc)}
  .sw::after{content:"";position:absolute;top:2.5px;left:2.5px;width:21px;height:21px;border-radius:50%;background:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .2s var(--ease)}
  .sw:checked::after{transform:translateX(18px)}

  @media (max-width:600px){
    .seg button{padding:8px 11px;font-size:12.5px}
    .btn{padding:11px 13px;font-size:14px}
    .row{gap:7px}
    .row label{font-size:11px}
    .grid{gap:7px}
  }

  /* editor overlay */
  .ed{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:20}
  .ed.open{display:flex;animation:edIn .22s var(--ease)}
  @keyframes edIn{from{opacity:0}}
  .ed .stage{flex:1;position:relative;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center}
  .ed .imgwrap{position:relative;line-height:0}
  .ed .imgwrap canvas{max-width:100%;display:block}
  .mask{position:absolute;border:1.5px solid var(--acc-hi);background:rgba(61,123,255,.16);border-radius:3px}
  .mask.black{background:rgba(0,0,0,.85);border-color:rgba(255,255,255,.35)}
  .mask:not(.sel){opacity:.5}
  .mask.sel{border-width:2px;opacity:1}
  .ed .bar button:disabled{opacity:.35}
  .mask .hd{position:absolute;width:34px;height:34px;right:-17px;bottom:-17px;border-radius:50%;
    background:var(--acc);border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5);touch-action:none}
  #brushLayer{position:absolute;left:0;top:0;touch-action:none;pointer-events:none}
  #brushLayer.active{pointer-events:auto}
  #toolSeg button{padding:8px 13px;font-size:12.5px}
  .ed .bar{display:flex;gap:8px;padding:11px 13px calc(11px + var(--safe-b));background:rgba(16,19,24,.97);
    border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
  .ed .nav{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;
    justify-content:space-between;padding:0 12px;pointer-events:none;z-index:5}
  .ed .nav .navmid{display:flex;gap:8px;pointer-events:none}
  .ed .nav .navmid button{font-size:18px;padding:7px 16px}
  .ed .nav button{pointer-events:auto;background:rgba(12,14,18,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line2);color:#fff;border-radius:99px;padding:9px 15px;font-size:14px;font-weight:600}
  .ed .bar .btn{padding:9px 13px;font-size:13.5px}

  .toast{position:fixed;left:50%;bottom:calc(28px + var(--safe-b));transform:translateX(-50%) translateY(8px);
    background:rgba(24,28,35,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line2);color:var(--txt);padding:11px 20px;border-radius:99px;
    font-size:14px;font-weight:500;display:none;z-index:40;white-space:nowrap;box-shadow:var(--shadow);
    opacity:0;transition:opacity .25s var(--ease), transform .25s var(--ease)}
  .toast.show{display:block;opacity:1;transform:translateX(-50%) translateY(0)}
  .busy{position:fixed;inset:0;background:rgba(4,5,8,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;z-index:50}
  .busy .card{background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r-lg);
    padding:22px 32px;text-align:center;font-size:15px;font-weight:550;box-shadow:var(--shadow)}
  .hidden{display:none!important}
</style>
</head>
<body>
<header>
  <h1>DateCover</h1>
  <span class="ver" id="ver">v1.9.1</span>
  <span class="count" id="count"></span>
</header>

<main id="main">
  <div class="drop" id="drop">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#3d7bff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L6 21"/></svg>
    <b>Tap to add photos</b>
    or drop them here — 20+ at once is fine.<br>
    Everything stays on this phone.
  </div>
  <div class="grid" id="grid"></div>
</main>

<div class="toolbar">
  <div class="seg" id="modeSeg">
    <button data-m="blur" class="on">Blur</button>
    <button data-m="black">Black box</button>
  </div>
  <button class="btn ghost" id="addBtn">+ Photos</button>
  <button class="btn grow" id="saveAll" disabled>Save all</button>
  <div class="row">
    <label>Box width</label>
    <input type="range" id="wRange" min="15" max="90" value="44">
    <label>Height</label>
    <input type="range" id="hRange" min="3" max="16" value="7">
    <label>Card every 5</label>
    <input type="checkbox" id="sepToggle" class="sw" checked>
    <label>Auto-dates</label>
    <input type="checkbox" id="ocrToggle" class="sw">
  </div>
</div>

<div class="ed" id="ed">
  <div class="nav">
    <button id="edBack">‹ Back</button>
    <div class="navmid">
      <button id="edPrev">‹</button>
      <button id="edNext">›</button>
    </div>
    <button id="edSave">Save this one</button>
  </div>
  <div class="stage" id="stage">
    <div class="imgwrap" id="imgwrap">
      <canvas id="edCanvas"></canvas>
      <canvas id="brushLayer"></canvas>
    </div>
  </div>
  <div class="bar">
    <div class="seg" id="toolSeg">
      <button data-t="box" class="on">Box</button>
      <button data-t="brush">Brush</button>
    </div>
    <button class="btn" id="addBox">+ Box</button>
    <button class="btn ghost" id="delBox">Delete box</button>
    <button class="btn ghost" id="undoBrush">Undo</button>
    <label style="font-size:12px;color:var(--mut);display:flex;align-items:center;gap:4px">Size
      <input type="range" id="brushRange" min="2" max="12" value="5" style="width:80px"></label>
    <button class="btn ghost" id="applyAll">Same box for all</button>
    <div class="seg" id="edModeSeg">
      <button data-m="blur" class="on">Blur</button>
      <button data-m="black">Black box</button>
    </div>
  </div>
</div>

<div class="busy" id="busy"><div class="card" id="busyTxt">Working…</div></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*" multiple hidden>

<script src="ocr/tesseract.min.js"></script>
<script>
const VERSION = "v1.9.1";
"use strict";
/* ---------- state ---------- */
const items = [];            // {id,name,file,img,w,h,box:{x,y,w,h},proc}
let mode = "blur";           // global default for new items
let seq = 0;
const $ = s => document.querySelector(s);
const grid = $("#grid"), countEl = $("#count"), file = $("#file");

function newBox(){ return {x:0.0, y:0.925, w:parseFloat($("#wRange").value)/100, h:parseFloat($("#hRange").value)/100}; }

/* find the timestamp text bbox in the bottom-left region using edge density;
   null when unsure (caller falls back to the tuned default box) */
function detectStamp(img,w,h){
  const s = Math.min(1, 800/w);
  const aw = Math.max(8,Math.round(w*s)), ah = Math.max(8,Math.round(h*s));
  const t = document.createElement("canvas"); t.width=aw; t.height=ah;
  const tx = t.getContext("2d"); tx.drawImage(img,0,0,aw,ah);
  let d;
  try{ d = tx.getImageData(0,0,aw,ah).data; }catch(e){ return null; }
  const lum = i => (d[i]*2+d[i+1]*3+d[i+2])/6;
  // horizontal edge density per row, full width
  const rowE = new Uint16Array(ah);
  for(let y=0;y<ah;y++)for(let x=0;x<aw-4;x++){
    const a=lum((y*aw+x)*4), b=lum((y*aw+x+4)*4);
    if(Math.abs(a-b)>55) rowE[y]++;
  }
  let peak = 0; for(let y=0;y<ah;y++) if(rowE[y]>peak) peak=rowE[y];
  const minE = Math.max(6, Math.round(peak*0.38));
  // collect thin dense bands anywhere in the image
  const bands = [];
  for(let y=0;y<ah;y++){
    if(rowE[y]<minE) continue;
    let y1=y, g=0, yy=y+1;
    for(;yy<ah;yy++){
      if(rowE[yy]>=minE){ y1=yy; g=0; }
      else if(++g>2) break;
    }
    bands.push({y0:y, y1});
    y = yy;
  }
  // merge overlapping bands
  const mb = [];
  for(const b of bands){
    if(mb.length && b.y0 <= mb[mb.length-1].y1+2) mb[mb.length-1].y1 = Math.max(mb[mb.length-1].y1, b.y1);
    else mb.push({...b});
  }
  let bestC = null;
  for(const b of mb){
    const bandH = b.y1-b.y0+1;
    if(bandH < ah*0.012 || bandH > ah*0.09) continue;   // stamp height range
    const colE = new Uint16Array(aw);
    for(let y=b.y0;y<=b.y1;y++)for(let x=0;x<aw-4;x++){
      const a=lum((y*aw+x)*4), b2=lum((y*aw+x+4)*4);
      if(Math.abs(a-b2)>55) colE[x]++;
    }
    const minCE = Math.max(2, Math.round(bandH*0.12));
    const maxGap = Math.round(aw*0.045);
    let best=null, cx0=-1, cx1=-1, gx=0;
    for(let x=0;x<aw;x++){
      if(colE[x]>=minCE){ if(cx0<0)cx0=x; cx1=x; gx=0; }
      else if(cx0>=0 && ++gx>maxGap){
        if(!best || cx1-cx0>best.x1-best.x0) best={x0:cx0,x1:cx1};
        cx0=-1;
      }
    }
    if(cx0>=0 && (!best || cx1-cx0>best.x1-best.x0)) best={x0:cx0,x1:cx1};
    if(!best) continue;
    const bw = best.x1-best.x0;
    if(bw<aw*0.08 || bw>aw*0.75) continue;
    // score: width coverage + edge strength, mild preference for lower half
    let eSum=0; for(let x=best.x0;x<=best.x1;x++) eSum+=colE[x];
    const dens = eSum/(bw*bandH);
    if(dens<0.15) continue;
    const posBonus = 1 + (b.y1/ah)*0.5;
    const score = dens * (bw/aw) * posBonus;
    if(!bestC || score>bestC.score) bestC = {score, x0:best.x0, x1:best.x1, y0:b.y0, y1:b.y1, bandH};
  }
  if(!bestC) return null;
  const {x0,x1,y0,y1,bandH} = bestC;
  const bw = x1-x0;
  const padL = Math.round(bw*0.04), padR = Math.round(aw*0.045), padY = Math.max(2,Math.round(bandH*0.35));
  const bx = Math.max(0,(x0-padL)/aw), by = Math.max(0,(y0-padY)/ah);
  return {
    x:bx,
    y:by,
    w:Math.min(1-bx,(x1+padR)/aw-bx),
    h:Math.min(1-by,(y1+padY)/ah-by)
  };
}

/* ---------- image loading (EXIF-safe) ---------- */
async function loadImage(f){
  try{
    const b = await createImageBitmap(f, {imageOrientation:"from-image"});
    return {img:b, w:b.width, h:b.height};
  }catch(e){
    const url = URL.createObjectURL(f);
    const im = await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    return {img:im, w:im.naturalWidth, h:im.naturalHeight, url};
  }
}

/* ---------- processing ---------- */
function process(it, tw, th){
  // draws it.img with covers applied; when tw/th given, renders directly at that scale
  const w = it.w, h = it.h;
  const s = tw ? Math.min(tw/w, th/h, 1) : 1;
  const cw = Math.max(1,Math.round(w*s)), ch = Math.max(1,Math.round(h*s));
  const c = document.createElement("canvas"); c.width = cw; c.height = ch;
  const x = c.getContext("2d");
  x.imageSmoothingQuality = "high";
  x.drawImage(it.img, 0, 0, cw, ch);
  for(const b of it.boxes) applyCover(x, cw, ch, b, mode);
  if(it.strokes) for(const st of it.strokes) applyStroke(x, cw, ch, st, mode);
  return c;
}
function applyCover(x, w, h, box, m){
  const bx = Math.round(box.x*w), by = Math.round(box.y*h);
  const bw = Math.max(1,Math.round(box.w*w)), bh = Math.max(1,Math.round(box.h*h));
  if(m === "black"){
    x.fillStyle = "#000"; x.fillRect(bx,by,bw,bh);
  }else{
    // pixelate-blur: shrink the region hard then scale it back
    const t = document.createElement("canvas");
    const k = Math.max(5, Math.round(bh/3.5));         // coarse mosaic: ~3 rows tall
    t.width = Math.max(1,Math.round(bw/k)); t.height = Math.max(1,Math.round(bh/k));
    const tx = t.getContext("2d");
    tx.drawImage(x.canvas, bx,by,bw,bh, 0,0,t.width,t.height);
    x.save(); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = "high";
    x.drawImage(t, 0,0,t.width,t.height, bx,by,bw,bh);
    if("filter" in x){ const r = Math.max(8,Math.round(bh/4)); x.filter = `blur(${r}px)`; x.drawImage(t,0,0,t.width,t.height,bx,by,bw,bh); x.filter = "none"; }
    x.restore();
  }
}

function strokePath(cx, pts, lw, style){
  cx.save();
  cx.strokeStyle = style; cx.lineWidth = lw;
  cx.lineCap = "round"; cx.lineJoin = "round";
  cx.beginPath();
  cx.moveTo(pts[0][0], pts[0][1]);
  for(let i=1;i<pts.length;i++) cx.lineTo(pts[i][0], pts[i][1]);
  if(pts.length===1) cx.lineTo(pts[0][0]+0.5, pts[0][1]+0.5);
  cx.stroke();
  cx.restore();
}
function applyStroke(x, w, h, st, m){
  const lw = st.size*Math.min(w,h);
  const pts = st.pts.map(p=>[p[0]*w, p[1]*h]);
  if(m === "black"){ strokePath(x, pts, lw, "#000"); return; }
  // blur inside the stroke: mosaic the bbox region, keep it only where the stroke passes
  let x0=1e9,y0=1e9,x1=-1,y1=-1;
  for(const p of pts){ x0=Math.min(x0,p[0]); y0=Math.min(y0,p[1]); x1=Math.max(x1,p[0]); y1=Math.max(y1,p[1]); }
  const pad = lw;
  x0=Math.max(0,Math.floor(x0-pad)); y0=Math.max(0,Math.floor(y0-pad));
  x1=Math.min(w,Math.ceil(x1+pad)); y1=Math.min(h,Math.ceil(y1+pad));
  const bw=x1-x0, bh=y1-y0;
  if(bw<2||bh<2) return;
  const bc = document.createElement("canvas"); bc.width=bw; bc.height=bh;
  const bx2 = bc.getContext("2d");
  // mosaic
  const t = document.createElement("canvas");
  const k = Math.max(5, Math.round(lw/2));
  t.width=Math.max(1,Math.round(bw/k)); t.height=Math.max(1,Math.round(bh/k));
  t.getContext("2d").drawImage(x.canvas, x0,y0,bw,bh, 0,0,t.width,t.height);
  bx2.imageSmoothingEnabled = true; bx2.imageSmoothingQuality = "high";
  bx2.drawImage(t,0,0,t.width,t.height,0,0,bw,bh);
  if("filter" in bx2){ bx2.filter = `blur(${Math.max(6,Math.round(lw/3))}px)`; bx2.drawImage(t,0,0,t.width,t.height,0,0,bw,bh); bx2.filter="none"; }
  // stroke mask
  const mc = document.createElement("canvas"); mc.width=bw; mc.height=bh;
  const mx = mc.getContext("2d");
  strokePath(mx, pts.map(p=>[p[0]-x0,p[1]-y0]), lw, "#fff");
  bx2.globalCompositeOperation = "destination-in";
  bx2.drawImage(mc,0,0);
  bx2.globalCompositeOperation = "source-over";
  x.drawImage(bc, x0, y0);
}

/* ---------- thumbnails ---------- */
function renderThumbs(){
  countEl.textContent = items.length ? items.length+" photo"+(items.length>1?"s":"") : "";
  $("#saveAll").disabled = !items.length;
  grid.innerHTML = "";
  for(const it of items){
    const cell = document.createElement("div"); cell.className = "cell";
    const cv = process(it, 360, 360);
    cv.style.width="100%"; cv.style.height="100%"; cv.style.objectFit="cover";
    cell.appendChild(cv);
    const rm = document.createElement("button"); rm.className="rm"; rm.textContent="×";
    rm.onclick = e=>{e.stopPropagation(); removeItem(it.id);};
    cell.appendChild(rm);
    cell.onclick = ()=>openEditor(it.id);
    grid.appendChild(cell);
  }
  $("#drop").classList.toggle("hidden", items.length>0);
}
function removeItem(id){
  const i = items.findIndex(x=>x.id===id);
  if(i>=0){ items.splice(i,1); renderThumbs(); }
}

/* ---------- add files ---------- */
async function addFiles(list){
  const fs = [...list].filter(f=>f.type.startsWith("image/") || /\.(jpe?g|png|webp|heic|heif)$/i.test(f.name));
  if(!fs.length) return toast("No images found");
  showBusy("Loading photos…");
  for(const f of fs){
    try{
      const {img,w,h,url} = await loadImage(f);
      const it = {id:++seq, name:f.name||("photo-"+seq), file:f, img, w, h, url, boxes:[detectStamp(img,w,h)||newBox()], strokes:[], ocrCount:0};
      items.push(it);
      if($("#ocrToggle").checked){
        it.ocrJob = ocrDates(it).then(boxes=>{ it.boxes.push(...boxes); it.ocrCount = boxes.length; it.ocrJob = null; renderThumbs(); })
          .catch(e=>{ console.warn("ocr", e); it.ocrJob = null; });
      }
    }catch(e){ console.warn("skip", f.name, e); }
  }
  hideBusy(); renderThumbs();
}

/* ---------- OCR date detection ---------- */
const MONTH = /(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/i;
function isDateToken(s0){
  const s = s0.replace(/^[^\w]+|[^\w)]+$/g,"");
  if(!s) return false;
  if(/\d/.test(s) && MONTH.test(s)) return true;                      // 24,Nov,2026 / Nov2026
  if(/^\(?\d{1,2}[,\.\/\\-]\d{1,2}[,\.\/\\-]\d{2,4}\)?\.?$/.test(s)) return true; // 24/11/2026
  if(/^\d{4}[-\/.]\d{1,2}[-\/.]\d{1,2}$/.test(s)) return true;          // 2026-11-24
  return false;
}
function isMonthToken(s){ return /^[A-Za-z]{3,9}\.?,?$/.test(s) && MONTH.test(s); }
function isNumToken(s){ return /^\(?\d{1,4}\)?[,.]?$/.test(s); }
async function ocrDates(it){
  if(typeof Tesseract === "undefined") return [];
  const sc = Math.min(1, 1600/Math.max(it.w, it.h));
  const ow = Math.max(8,Math.round(it.w*sc)), oh = Math.max(8,Math.round(it.h*sc));
  const c = document.createElement("canvas"); c.width = ow; c.height = oh;
  c.getContext("2d").drawImage(it.img, 0, 0, ow, oh);
  const ob = new URL("ocr/", location.href).href;
  const res = await Tesseract.recognize(c, "eng", {
    workerPath: ob + "worker.min.js",
    corePath: ob + "tesseract-core-simd-lstm.wasm.js",
    langPath: ob.replace(/\/$/, ""),
    gzip: false,
    cacheMethod: "none",
    workerBlobIO: false
  });
  const words = (res && res.data && res.data.words) || [];
  const good = words.filter(wd => wd.confidence > 30 && wd.text && wd.text.trim().length > 0);
  // group words into lines by vertical overlap
  const lines = [];
  for(const wd of good.sort((a,b)=>a.bbox.y0-b.bbox.y0 || a.bbox.x0-b.bbox.x0)){
    const cy = (wd.bbox.y0+wd.bbox.y1)/2, hh = wd.bbox.y1-wd.bbox.y0;
    let line = lines.find(L => Math.abs(L.cy-cy) < Math.max(hh,L.hh)*0.6);
    if(!line){ line = {cy, hh, ws:[]}; lines.push(line); }
    line.ws.push(wd);
    line.cy = (line.cy* (line.ws.length-1) + cy)/line.ws.length;
    line.hh = Math.max(line.hh, hh);
  }
  const out = [];
  for(const L of lines){
    L.ws.sort((a,b)=>a.bbox.x0-b.bbox.x0);
    const mark = new Set();
    L.ws.forEach((wd,i)=>{
      const t = wd.text.trim();
      if(isDateToken(t)){
        mark.add(i);
        // swallow adjacent numeric/month tokens that belong to the same date
        for(const j of [i-1,i+1]){
          const n = L.ws[j];
          if(n && (isNumToken(n.text.trim()) || isMonthToken(n.text.trim())) &&
             Math.abs((j<i? n.bbox.x1-wd.bbox.x0 : wd.bbox.x1-n.bbox.x0)) < L.hh*3){
            // gap small enough
            const gap = j<i ? wd.bbox.x0-n.bbox.x1 : n.bbox.x0-wd.bbox.x1;
            if(gap < L.hh*2.5) mark.add(j);
          }
        }
      }
    });
    // month-name tokens with a numeric neighbor (covers "24 Nov 2026" split in 3 words)
    L.ws.forEach((wd,i)=>{
      if(!isMonthToken(wd.text.trim())) return;
      const near = [i-1,i+1].some(j=>{
        const n = L.ws[j];
        if(!n || !isNumToken(n.text.trim())) return false;
        const gap = j<i ? wd.bbox.x0-n.bbox.x1 : n.bbox.x0-wd.bbox.x1;
        return gap < L.hh*2.5;
      });
      if(near){
        mark.add(i);
        for(const j of [i-2,i-1,i+1,i+2]){
          const n = L.ws[j];
          if(n && isNumToken(n.text.trim())){
            const gap = j<i ? wd.bbox.x0-n.bbox.x1 : n.bbox.x0-wd.bbox.x1;
            if(gap < L.hh*4) mark.add(j);
          }
        }
      }
    });
    if(!mark.size) continue;
    // merge consecutive marked words into boxes
    const idxs = [...mark].sort((a,b)=>a-b);
    let grp = [idxs[0]];
    const flush = ()=>{
      let x0=1e9,y0=1e9,x1=-1,y1=-1;
      for(const i of grp){ const b=L.ws[i].bbox; x0=Math.min(x0,b.x0); y0=Math.min(y0,b.y0); x1=Math.max(x1,b.x1); y1=Math.max(y1,b.y1); }
      const padX = (y1-y0)*0.6, padY = (y1-y0)*0.35;
      out.push({
        x: Math.max(0,(x0-padX)/ow),
        y: Math.max(0,(y0-padY)/oh),
        w: Math.min(1, (x1+padX)/ow) - Math.max(0,(x0-padX)/ow),
        h: Math.min(1, (y1+padY)/oh) - Math.max(0,(y0-padY)/oh)
      });
      grp = [];
    };
    for(let k=1;k<idxs.length;k++){
      const prev = L.ws[idxs[k-1]], curW = L.ws[idxs[k]];
      if(idxs[k]===idxs[k-1]+1 && curW.bbox.x0-prev.bbox.x1 < L.hh*3){ grp.push(idxs[k]); }
      else { flush(); grp.push(idxs[k]); }
    }
    if(grp.length) flush();
  }
  // drop boxes that overlap the main stamp box (already covered)
  return out.filter(b=>{
    const m = it.boxes[0];
    const ox = Math.max(0, Math.min(b.x+b.w, m.x+m.w) - Math.max(b.x, m.x));
    const oy = Math.max(0, Math.min(b.y+b.h, m.y+m.h) - Math.max(b.y, m.y));
    return ox*oy < b.w*b.h*0.6;
  });
}
$("#ocrToggle").checked = localStorage.getItem("ocrOn")==="1";
$("#ocrToggle").onchange = ()=>localStorage.setItem("ocrOn", $("#ocrToggle").checked?"1":"0");
$("#addBtn").onclick = ()=>file.click();

/* ---------- mode + box sliders ---------- */
function setMode(m){
  mode = m;
  document.querySelectorAll("#modeSeg button, #edModeSeg button")
    .forEach(b=>b.classList.toggle("on", b.dataset.m===m));
  renderThumbs();
}
$("#modeSeg").onclick = e=>{ if(e.target.dataset.m) setMode(e.target.dataset.m); };
$("#edModeSeg").onclick = e=>{ if(e.target.dataset.m){ setMode(e.target.dataset.m); if(cur) drawEditor(); } };

/* ---------- editor ---------- */
let cur = null, dScale = 1, curSel = 0;
const ed=$("#ed"), stage=$("#stage"), wrap=$("#imgwrap"), edC=$("#edCanvas");
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
function openEditor(id){
  cur = items.find(i=>i.id===id); if(!cur) return;
  curSel = 0;
  ed.classList.add("open"); resetZoom(); drawEditor();
}
function navEditor(dir){
  const i = items.indexOf(cur);
  const n = items[i+dir];
  if(!n){ toast(dir>0 ? "Last photo" : "First photo"); return; }
  cur = n; curSel = 0; resetZoom(); drawEditor();
}
$("#edPrev").onclick = ()=>navEditor(-1);
$("#edNext").onclick = ()=>navEditor(1);
let dispW = 0, dispH = 0;
function drawEditor(){
  const dpr = Math.min(window.devicePixelRatio||1, 2.5);
  const sw = stage.clientWidth, sh = stage.clientHeight;
  dScale = Math.min(sw/cur.w, sh/cur.h, 1);
  dispW = Math.max(1,Math.round(cur.w*dScale));
  dispH = Math.max(1,Math.round(cur.h*dScale));
  const cv = process(cur, Math.round(dispW*dpr), Math.round(dispH*dpr));
  edC.width = cv.width; edC.height = cv.height;
  edC.getContext("2d").drawImage(cv,0,0);
  edC.style.width = dispW+"px"; edC.style.height = dispH+"px";
  sizeBrushLayer();
  bl.classList.toggle("active", tool==="brush");
  renderMasks();
  $("#edPrev").style.opacity = items.indexOf(cur)>0 ? 1 : .35;
  $("#edNext").style.opacity = items.indexOf(cur)<items.length-1 ? 1 : .35;
}
/* ---------- zoom & pan ---------- */
let zoomS = 1, zoomX = 0, zoomY = 0;
function applyZoom(){
  wrap.style.transformOrigin = "0 0";
  wrap.style.transform = `translate(${zoomX}px,${zoomY}px) scale(${zoomS})`;
}
function resetZoom(){ zoomS = 1; zoomX = 0; zoomY = 0; applyZoom(); }
function clampPan(){
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const lw = (sw - dispW)/2, lt = (sh - dispH)/2;
  const vw = dispW*zoomS, vh = dispH*zoomS;
  if(vw >= sw) zoomX = clamp(zoomX, sw - vw - lw, -lw);
  else zoomX = clamp(zoomX, -lw - (sw-vw)/2, -lw + (sw-vw)/2);
  if(vh >= sh) zoomY = clamp(zoomY, sh - vh - lt, -lt);
  else zoomY = clamp(zoomY, -lt - (sh-vh)/2, -lt + (sh-vh)/2);
}
function zoomTo(ns, cx, cy){
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const lw = (sw - dispW)/2, lt = (sh - dispH)/2;
  ns = clamp(ns, 1, 6);
  const px = (cx - lw - zoomX)/zoomS, py = (cy - lt - zoomY)/zoomS;
  zoomS = ns;
  zoomX = cx - lw - px*ns;
  zoomY = cy - lt - py*ns;
  clampPan(); applyZoom();
}
const edPointers = new Map();
let pinch = null, panDrag = null, swipeTrk = null;
stage.addEventListener("pointerdown", e=>{
  edPointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(edPointers.size===2){
    if(bstroke){ bstroke = null; blx.clearRect(0,0,bl.width,bl.height); }
    const [a,b2] = [...edPointers.values()];
    pinch = {d:Math.hypot(a.x-b2.x,a.y-b2.y), s:zoomS};
    panDrag = null; swipeTrk = null;
  }else if(edPointers.size===1){
    if(e.target===stage){
      swipeTrk = {x:e.clientX, y:e.clientY};
    }else if((e.target===edC || e.target===bl) && zoomS>1 && tool!=="brush"){
      panDrag = {sx:e.clientX, sy:e.clientY, zx:zoomX, zy:zoomY};
    }else if((e.target===edC) && zoomS>1 && tool==="brush"){
      // in brush mode single finger brushes; no pan
    }
  }
});
stage.addEventListener("pointermove", e=>{
  if(!edPointers.has(e.pointerId)) return;
  edPointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pinch && edPointers.size===2){
    const [a,b2] = [...edPointers.values()];
    const nd = Math.hypot(a.x-b2.x,a.y-b2.y);
    if(pinch.d>0){
      const r = stage.getBoundingClientRect();
      const cx = (a.x+b2.x)/2 - r.left, cy = (a.y+b2.y)/2 - r.top;
      zoomTo(pinch.s * nd/pinch.d, cx, cy);
    }
  }else if(panDrag){
    zoomX = panDrag.zx + (e.clientX - panDrag.sx);
    zoomY = panDrag.zy + (e.clientY - panDrag.sy);
    clampPan(); applyZoom();
  }
});
stage.addEventListener("pointerup", e=>{
  const wasPinch = edPointers.size===2;
  edPointers.delete(e.pointerId);
  if(edPointers.size<2) pinch = null;
  if(edPointers.size===0){
    if(swipeTrk && zoomS===1){
      const dx = e.clientX - swipeTrk.x, dy = e.clientY - swipeTrk.y;
      if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) navEditor(dx<0?1:-1);
    }
    // double-tap zoom
    if(!wasPinch && e.target!==stage){
      const now = Date.now();
      const r = stage.getBoundingClientRect();
      if(now - lastTapT < 320 && Math.hypot(e.clientX-lastTapX, e.clientY-lastTapY) < 40){
        if(zoomS>1.2) resetZoom();
        else zoomTo(2.6, e.clientX - r.left, e.clientY - r.top);
        lastTapT = 0;
      }else lastTapT = now;
      lastTapX = e.clientX; lastTapY = e.clientY;
    }
    panDrag = null; swipeTrk = null;
  }
});
stage.addEventListener("pointercancel", e=>{
  edPointers.delete(e.pointerId);
  if(edPointers.size<2) pinch = null;
  if(edPointers.size===0){ panDrag = null; swipeTrk = null; }
});
let lastTapT = 0, lastTapX = 0, lastTapY = 0;
function renderMasks(){
  wrap.querySelectorAll(".mask").forEach(m=>m.remove());
  const cw = dispW || edC.width, ch = dispH || edC.height;
  cur.boxes.forEach((b, idx)=>{
    const m = document.createElement("div");
    m.className = "mask"+(idx===curSel?" sel":"")+(mode==="black"?" black":"");
    m.style.pointerEvents = (typeof tool!=="undefined" && tool==="brush") ? "none" : "auto";
    const hd = document.createElement("div"); hd.className="hd"; m.appendChild(hd);
    m.style.left = (b.x*cw)+"px"; m.style.top = (b.y*ch)+"px";
    m.style.width = (b.w*cw)+"px"; m.style.height = (b.h*ch)+"px";
    let drag = null;
    m.addEventListener("pointerdown", e=>{
      e.preventDefault(); e.stopPropagation();
      curSel = idx;
      wrap.querySelectorAll(".mask").forEach((mm,i)=>mm.classList.toggle("sel", i===idx));
      m.setPointerCapture(e.pointerId);
      const onHd = e.target===hd;
      drag = {onHd, sx:e.clientX, sy:e.clientY,
        l:parseFloat(m.style.left), t:parseFloat(m.style.top),
        w:parseFloat(m.style.width), h:parseFloat(m.style.height)};
    });
    m.addEventListener("pointermove", e=>{
      if(!drag) return;
      const dx = (e.clientX-drag.sx)/zoomS, dy = (e.clientY-drag.sy)/zoomS;
      if(drag.onHd){
        m.style.width  = clamp(drag.w+dx, cw*0.03, cw-drag.l)+"px";
        m.style.height = clamp(drag.h+dy, ch*0.03, ch-drag.t)+"px";
      }else{
        m.style.left = clamp(drag.l+dx, 0, cw-drag.w)+"px";
        m.style.top  = clamp(drag.t+dy, 0, ch-drag.h)+"px";
      }
    });
    m.addEventListener("pointerup", ()=>{
      if(!drag) return;
      drag = null;
      b.x = clamp(parseFloat(m.style.left)/cw, 0, 1-b.w);
      b.y = clamp(parseFloat(m.style.top)/ch, 0, 1-b.h);
      b.w = clamp(parseFloat(m.style.width)/cw, 0.02, 1);
      b.h = clamp(parseFloat(m.style.height)/ch, 0.02, 1);
      drawEditor(); renderThumbs();
    });
    wrap.appendChild(m);
  });
  $("#delBox").disabled = curSel===0;
}
$("#addBox").onclick = ()=>{
  if(!cur) return;
  cur.boxes.push({x:0.3, y:0.4, w:parseFloat($("#wRange").value)/100, h:parseFloat($("#hRange").value)/100});
  curSel = cur.boxes.length-1;
  drawEditor();
};
$("#delBox").onclick = ()=>{
  if(!cur || curSel===0) return;
  cur.boxes.splice(curSel,1);
  curSel = 0;
  drawEditor(); renderThumbs();
};
$("#edBack").onclick = ()=>{ ed.classList.remove("open"); cur=null; renderThumbs(); };

/* ---------- brush tool ---------- */
let tool = "box", brushSize = 0.05;
$("#brushRange").oninput = ()=>{ brushSize = +$("#brushRange").value/100; };
const bl = $("#brushLayer"), blx = bl.getContext("2d");
$("#toolSeg").onclick = e=>{
  if(!e.target.dataset.t) return;
  tool = e.target.dataset.t;
  document.querySelectorAll("#toolSeg button").forEach(b=>b.classList.toggle("on", b.dataset.t===tool));
  bl.classList.toggle("active", tool==="brush");
  if(cur) renderMasks();
};
function sizeBrushLayer(){
  bl.width = edC.width; bl.height = edC.height;
  bl.style.width = edC.style.width; bl.style.height = edC.style.height;
}
let bstroke = null;
bl.addEventListener("pointerdown", e=>{
  if(tool!=="brush" || !cur) return;
  e.preventDefault(); bl.setPointerCapture(e.pointerId);
  const r = bl.getBoundingClientRect();
  bstroke = {pts:[[ (e.clientX-r.left)/bl.width, (e.clientY-r.top)/bl.height ]], size:brushSize};
});
bl.addEventListener("pointermove", e=>{
  if(!bstroke) return;
  const r = bl.getBoundingClientRect();
  bstroke.pts.push([ (e.clientX-r.left)/bl.width, (e.clientY-r.top)/bl.height ]);
  blx.clearRect(0,0,bl.width,bl.height);
  strokePath(blx, bstroke.pts.map(p=>[p[0]*bl.width,p[1]*bl.height]), brushSize*Math.min(bl.width,bl.height),
    mode==="black" ? "rgba(0,0,0,.9)" : "rgba(79,140,255,.65)");
});
bl.addEventListener("pointerup", ()=>{
  if(!bstroke) return;
  if(bstroke.pts.length>1) cur.strokes.push(bstroke);
  bstroke = null;
  blx.clearRect(0,0,bl.width,bl.height);
  drawEditor(); renderThumbs();
});
$("#undoBrush").onclick = ()=>{
  if(!cur) return;
  if(cur.strokes.length){ cur.strokes.pop(); drawEditor(); renderThumbs(); }
  else toast("Nothing to undo");
};
$("#applyAll").onclick = ()=>{
  if(!cur) return;
  items.forEach(i=>{ if(i!==cur){ i.boxes = cur.boxes.map(b=>({...b})); i.strokes = cur.strokes.map(s=>({size:s.size, pts:s.pts.map(p=>[...p])})); } });
  renderThumbs(); toast("Applied to all photos");
};
$("#edSave").onclick = async ()=>{ if(cur){ await saveOne(cur); toast("Saved"); } };

/* ---------- save ---------- */
function extOf(name,type){
  const m = /\.(\w+)$/.exec(name); if(m) return "."+m[1].toLowerCase();
  return type==="image/png" ? ".png" : ".jpg";
}
function baseName(name){ return name.replace(/\.[^.]+$/,""); }
async function blobOf(it){
  if(it.ocrJob) await it.ocrJob;
  const c = process(it);
  const type = (it.file.type === "image/png") ? "image/png" : "image/jpeg";
  return await new Promise(r=>c.toBlob(r,type,1.0));
}
async function saveOne(it){
  const b = await blobOf(it);
  const f = new File([b], baseName(it.name)+"-clean"+extOf(it.name,b.type), {type:b.type});
  if(navigator.canShare && navigator.canShare({files:[f]})){
    try{ await navigator.share({files:[f]}); return; }catch(e){ if(e.name==="AbortError") return; }
  }
  downloadBlob(b, f.name);
}
async function saveAll(){
  if(!items.length) return;
  showBusy("Processing photos…");
  const files = [];
  const sep = $("#sepToggle").checked;
  let sepN = 0;
  for(let i=0;i<items.length;i++){
    const it = items[i];
    const b = await blobOf(it);
    files.push(new File([b], baseName(it.name)+"-clean"+extOf(it.name,b.type), {type:b.type}));
    $("#busyTxt").textContent = "Processing "+(i+1)+" / "+items.length;
    if(sep && (i+1)%5===0 && i<items.length-1){
      files.push(await makeCardFile(++sepN));
    }
  }
  hideBusy();
  const oc = items.reduce((n,i)=>n+(i.ocrCount||0),0);
  if(oc) toast(oc+" date"+(oc>1?"s":"")+" found & covered");
  if(navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files}); toast("Done"); return; }
    catch(e){ if(e.name==="AbortError") return; }
  }
  // fallback: zip them
  showBusy("Making ZIP…");
  const zip = await makeZip(files);
  hideBusy();
  downloadBlob(zip, "datecover-photos.zip");
  toast("Saved as ZIP");
}
$("#saveAll").onclick = saveAll;

function makeCardFile(n){
  return new Promise(res=>{
    const c = document.createElement("canvas"); c.width = 1200; c.height = 1200;
    const x = c.getContext("2d");
    const hue = Math.floor(Math.random()*360);
    x.fillStyle = "hsl("+hue+",65%,45%)";
    x.fillRect(0,0,1200,1200);
    c.toBlob(b=>res(new File([b], "_card-"+String(n).padStart(2,"0")+".jpg", {type:"image/jpeg"})), "image/jpeg", 0.9);
  });
}

function downloadBlob(blob, name){
  const u = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=u; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u), 4000);
}

/* ---------- minimal store-only ZIP ---------- */
const crcT = (()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c;}return t;})();
const crc32 = b=>{let c=~0;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return ~c>>>0;};
async function makeZip(files){
  const enc = new TextEncoder(), parts=[], central=[]; let off=0;
  for(const f of files){
    const nm = enc.encode(f.name), data = new Uint8Array(await f.arrayBuffer()), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0,true);
    lh.setUint16(8,0,true); lh.setUint16(10,0,true); lh.setUint16(12,0,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true);
    lh.setUint16(26,nm.length,true); lh.setUint16(28,0,true);
    parts.push(lh.buffer, nm, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true);
    ch.setUint16(8,0,true); ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true);
    ch.setUint16(28,nm.length,true); ch.setUint32(42,off,true);
    central.push(ch.buffer, nm);
    off += 30 + nm.length + data.length;
  }
  let csz = 0; central.forEach(p=>csz+=p.byteLength);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,csz,true); end.setUint32(16,off,true);
  return new Blob([...parts, ...central, end.buffer], {type:"application/zip"});
}

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }

function hideBusy(){ $("#busy").style.display="none"; }
